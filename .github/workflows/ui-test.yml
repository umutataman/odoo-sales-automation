on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *' # every day at midnight
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start Odoo test environment
        run: ./scripts/setup_odoo.sh

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies and browser
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium

      - name: Run test in parallel
        run: uv run pytest -n auto

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/
            test-results/